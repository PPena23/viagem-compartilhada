<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12447A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viagens">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Viagem Compartilhada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('vg_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#EEF1F5;--surface:#fff;--ink:#121A26;--mut:#5B6778;--line:#D8DEE6;--soft:#F5F7FA;
  --pri:#12447A;--pri-ink:#fff;--pri-soft:#E4ECF6;--stripe:#F4B400;
  --ok:#17795A;--ok-soft:#DDF1E8;--warn:#8A5A00;--warn-soft:#FCEFCB;--info:#1F4E9C;--info-soft:#DDE8FA;--bad:#B42318;
  --avatar-ink:var(--pri);--btn-bg:var(--pri);--link:var(--pri);--nav-on:var(--pri);color-scheme:light;
  --r:14px;--rs:10px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131B;--surface:#16202C;--ink:#E9EEF4;--mut:#95A3B5;--line:#283545;--soft:#1B2735;
  --pri:#0E2F57;--pri-soft:#1A2D47;--ok:#2FA67C;--ok-soft:#14352A;--warn:#F0B64D;--warn-soft:#3A2D10;--info:#8DB4F5;--info-soft:#18294A;--bad:#FF8A7A;
  --avatar-ink:#BBD3F2;--btn-bg:#2B6CB8;--link:#9CC1F2;--nav-on:#9CC1F2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131B;--surface:#16202C;--ink:#E9EEF4;--mut:#95A3B5;--line:#283545;--soft:#1B2735;
  --pri:#0E2F57;--pri-soft:#1A2D47;--ok:#2FA67C;--ok-soft:#14352A;--warn:#F0B64D;--warn-soft:#3A2D10;--info:#8DB4F5;--info-soft:#18294A;--bad:#FF8A7A;
  --avatar-ink:#BBD3F2;--btn-bg:#2B6CB8;--link:#9CC1F2;--nav-on:#9CC1F2;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-bottom:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Public Sans",system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--stripe);outline-offset:2px}
button{font:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Topo com a rota */
.top{background:var(--pri);color:var(--pri-ink);padding:14px 16px 16px}
.top-in{max-width:760px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .who{font-size:13px;opacity:.8;margin-top:1px}
.tools{display:flex;gap:8px}
.icon-btn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:var(--rs);min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.route{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;font-size:14px}
.route .dot{width:12px;height:12px;border-radius:50%;border:3px solid #fff;flex:none}
.route .line{flex:1;border-top:3px dashed var(--stripe);min-width:24px}
.route span.t{white-space:nowrap}

main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:15px;font-weight:600;margin:20px 0 8px}
.mut{color:var(--mut);font-size:14px}
.sm{font-size:13px}

/* Superfície e listas */
.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden}
.pad{padding:16px}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--pri-soft);color:var(--avatar-ink);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.amount{font-weight:800;font-size:18px;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}

/* Formulários */
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--mut)}
input,select{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:var(--rs);background:var(--soft);color:var(--ink);font:inherit}
input:focus,select:focus{border-color:var(--pri);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.field-note{font-size:13px;color:var(--mut);margin-top:6px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--rs);border:1px solid transparent;background:var(--btn-bg);color:#fff;font-weight:600}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--link);padding:0 10px}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}

/* Selo de status */
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px 2px 8px;font-size:13px;font-weight:600}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-pend{background:var(--warn-soft);color:var(--warn)}.t-sent{background:var(--info-soft);color:var(--info)}.t-paid{background:var(--ok-soft);color:var(--ok)}

/* Seletor de dia / período */
.stepper{display:flex;align-items:center;gap:8px}
.stepper .mid{flex:1;text-align:center}
.stepper .mid b{font-size:17px;font-weight:800;display:block}
.stepper input{text-align:center;font-weight:600}

/* Chips Ida / Volta (motorista) */
.legs{display:flex;gap:8px}
.leg{min-width:96px;height:44px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);color:var(--mut);font-weight:600;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.leg.on{background:var(--ok);border-color:var(--ok);color:#fff}
.leg small{font-size:11px;font-weight:500;opacity:.9}
.leg .row1{display:inline-flex;gap:5px;align-items:center}
.leg .row1 svg{width:16px;height:16px}

/* Passagem destacável (passageiro) */
.ticket{position:relative;display:block;width:100%;text-align:left;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);overflow:hidden;margin:12px 0}
.ticket .main{padding:18px 18px 16px;display:flex;align-items:center;gap:14px}
.ticket .main .big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ticket .main .rt{font-size:14px;color:var(--mut)}
.ticket .badge{margin-left:auto;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.ticket .badge svg{width:26px;height:26px;stroke-width:3}
.ticket .stub{position:relative;border-top:2px dashed var(--line);padding:12px 18px;font-size:14px;font-weight:600;color:var(--mut);background:var(--soft)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .stub::before{left:-12px}.ticket .stub::after{right:-12px}
.ticket.on{border-color:var(--ok)}
.ticket.on .main{background:var(--ok);color:#fff}
.ticket.on .main .rt{color:rgba(255,255,255,.85)}
.ticket.on .badge{border-color:#fff;color:#fff}
.ticket.on .stub{background:var(--ok-soft);color:var(--ok);border-top-color:var(--ok)}
.ticket.off{opacity:.55;pointer-events:none}
@keyframes stamp{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.ticket.on .badge{animation:stamp .28s ease-out}
@media(prefers-reduced-motion:reduce){.ticket.on .badge{animation:none}.btn:active{transform:none}}

/* Resumo */
.summary{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.summary .total{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv b{font-weight:600}

/* Tabela */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--soft)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:inherit;padding-left:16px}
td:first-child{background:var(--surface);font-weight:600}
th:first-child{background:var(--soft)}
tr:last-child td{border-bottom:0}
td.v{font-weight:800}
.mark{display:inline-block;min-width:26px;padding:1px 6px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px}
.mark.none{background:none;color:var(--line)}
.mark.paid{background:var(--ok);color:#fff}
.bx{padding:0 16px 16px}
.bxrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.bxrow .grow{flex:1;min-width:0}
.bx .leg{min-width:100px;height:44px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mark svg{width:14px;height:14px;vertical-align:-2px;stroke-width:3}

pre{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:var(--rs);padding:12px;font:14px/1.5 inherit;margin:0 16px 14px}
.hide{display:none!important}
.alert{border-radius:var(--rs);padding:10px 12px;font-size:14px;margin-top:10px;background:var(--warn-soft);color:var(--warn)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}

/* Barra inferior */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);min-height:62px;padding:8px 4px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
nav button.on{color:var(--nav-on)}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--stripe)}

/* Login */
.login{max-width:400px;margin:28px auto 0}
.login .mark-big{width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;display:grid;place-items:center;margin-bottom:16px}
.login .mark-big svg{width:30px;height:30px}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;font-size:14px;font-weight:600;max-width:90vw}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div><b>Viagem Compartilhada</b><div class="who" id="who"></div></div><div class="tools"><button id="tema" class="icon-btn" onclick="toggleTheme()"></button><button id="sair" class="icon-btn hide" onclick="logout()" aria-label="Sair"></button></div></div>
  <div class="route" id="route" aria-label="Rota"></div>
</div></header>
<main id="app"></main>
<nav id="nav" class="hide" aria-label="Seções"><div class="in" id="navin"></div></nav>
<script>
// ---------- Ícones ----------
const IC={
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 circle:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 users:'<path d="M16 19v-1a4 4 0 00-4-4H8a4 4 0 00-4 4v1"/><circle cx="10" cy="8" r="3"/><path d="M20 19v-1a4 4 0 00-3-3.9M15 5.1a3 3 0 010 5.8"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/>',
 out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H10"/>',
 chat:'<path d="M21 12a8 8 0 01-11.8 7L4 20l1.1-4.6A8 8 0 1121 12z"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
 bus:'<rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16M8 20v-3M16 20v-3"/><circle cx="8.5" cy="14" r=".6"/><circle cx="15.5" cy="14" r=".6"/>'
};
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';

// ---------- API ----------
let token=localStorage.getItem('vg_token')||'',S=null,tab='',selDate='',periodIdx=null,editId=null;
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token){token='';localStorage.removeItem('vg_token');S=null;await boot();throw new Error(j.error||'Sessão expirada')}
  if(!r.ok)throw new Error(j.error||'Erro');
  return j;
}
async function act(method,url,body){try{await api(method,url,body);await load()}catch(e){toast(e.message)}}
async function load(){S=await api('GET','/api/state');render()}

// ---------- Datas e utilidades ----------
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
const parse=s=>new Date(s+'T12:00:00');
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const dm=s=>{const [y,m,d]=s.split('-');return d+'/'+m};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const DOWL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const dow=s=>DOW[parse(s).getDay()];
const dowl=s=>DOWL[parse(s).getDay()];
const money=v=>'R$ '+v.toFixed(2).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>{const p=n.trim().split(/\s+/);return ((p[0]||'')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
function toast(m){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
async function copy(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('Texto copiado')}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}

// ---------- Períodos e cálculo ----------
const len=()=>+S.cfg.ciclo;
const idxOf=s=>Math.floor(diffD(s,S.cfg.anchor)/len());
const pStart=i=>addD(S.cfg.anchor,i*len());
const pDays=i=>{const a=pStart(i),r=[];for(let k=0;k<len();k++){const d=addD(a,k);const w=parse(d).getDay();if(w>=1&&w<=5)r.push(d)}return r};
const pLabel=i=>{const d=pDays(i);return dm(d[0])+' a '+dm(d[d.length-1])};
const pKey=(i,pid)=>pStart(i)+'|'+pid;
const fareOf=p=>p.tarifa>0?p.tarifa:S.cfg.fare;
const legs=(d,pid)=>{const t=S.trips[d+'|'+pid];return t?{ida:!!t.ida,volta:!!t.volta,fare:t.fare,idaAt:t.idaAt,voltaAt:t.voltaAt,idaBy:t.idaBy,voltaBy:t.voltaBy}:{ida:false,volta:false,fare:0}};
function personPeriod(pid,i){let n=0,total=0,paid=0,rows=[];for(const d of pDays(i)){const t=S.trips[d+'|'+pid];if(!t)continue;const c=(t.ida?1:0)+(t.volta?1:0);if(!c)continue;const pi=!!(t.ida&&t.idaPago),pv=!!(t.volta&&t.voltaPago),pc=(pi?1:0)+(pv?1:0);n+=c;total+=c*t.fare;paid+=pc*t.fare;rows.push({d,ida:!!t.ida,volta:!!t.volta,idaPago:pi,voltaPago:pv,fare:t.fare,v:c*t.fare,open:(c-pc)*t.fare})}return{n,total,paid,open:+(total-paid).toFixed(2),rows}}
function pending(pid,upto){let tot=0,list=[];const ds=Object.keys(S.trips).map(k=>k.split('|')[0]).sort();if(!ds.length)return{tot:0,list};for(let i=idxOf(ds[0]);i<upto;i++){const r=personPeriod(pid,i);if(r.open>0){tot+=r.open;list.push({i,open:r.open})}}return{tot:+tot.toFixed(2),list}}
function openItemsAll(pid){const it=[];for(const k in S.trips){const [d,id]=k.split('|');if(id!==pid)continue;const t=S.trips[k];if((t.ida&&!t.idaPago)||(t.volta&&!t.voltaPago))it.push({pid,date:d})}return it}
function openTotal(pid){let tot=0;for(const k in S.trips){if(!k.endsWith('|'+pid))continue;const t=S.trips[k];if(t.ida&&!t.idaPago)tot+=t.fare;if(t.volta&&!t.voltaPago)tot+=t.fare}return +tot.toFixed(2)}
const tagOf=(st,r)=>r&&r.total>0&&r.open<=0?'<span class="tag t-paid">Pago</span>':r&&r.paid>0?'<span class="tag t-sent">Pago em parte</span>':st.sent?'<span class="tag t-sent">Cobrança enviada</span>':'<span class="tag t-pend">Em aberto</span>';
const statusTxt=(st,r)=>r.total>0&&r.open<=0?'Pago':r.paid>0?'Pago em parte':st.sent?'Enviada':'Em aberto';

// ---------- Mensagem de cobrança ----------
const phoneBR=p=>{let d=(p||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return d};
function buildMsg(p,i){
  const r=personPeriod(p.id,i),pend=pending(p.id,i),L=[];
  L.push('Olá, '+p.nome.split(' ')[0]+'!','Cobrança das viagens '+S.cfg.origem+' e '+S.cfg.destino,'Período: '+pLabel(i),'');
  for(const x of r.rows){if(x.open<=0)continue;const oi=x.ida&&!x.idaPago,ov=x.volta&&!x.voltaPago;L.push('- '+dow(x.d)+' '+dm(x.d)+' ('+(oi&&ov?'ida e volta':oi?'só ida':'só volta')+'): '+money(x.open))}
  if(r.open<=0)L.push('(nada em aberto no período)');
  if(r.paid>0)L.push('','Já pago neste período: '+money(r.paid));
  L.push('','*Em aberto no período: '+money(r.open)+'*');
  if(pend.tot>0)L.push('Em aberto de períodos anteriores: '+money(pend.tot),'*Total a pagar: '+money(r.open+pend.tot)+'*');
  if(S.cfg.pix)L.push('','Pix: '+S.cfg.pix);
  if(S.cfg.msgFim)L.push('',S.cfg.msgFim);
  return L.join('\n');
}

async function baixa(items,val,msg){
  if(!items.length)return toast('Não há nada em aberto para dar baixa');

  try{const r=await api('POST','/api/baixa',{items,val});await load();toast((val?'Baixa registrada: ':'Baixa desfeita: ')+money(r.valor))}catch(e){toast(e.message)}

function bxLeg(el){const d=el.dataset,paid=d.paid==='1';baixa([{pid:d.pid,date:d.d,leg:d.leg}],!paid,paid?'Desfazer a baixa deste trecho? Ele volta a ficar em aberto.':null)}
function bxPeriod(el){const d=el.dataset,r=personPeriod(d.pid,+d.i);baixa(r.rows.filter(x=>x.open>0).map(x=>({pid:d.pid,date:x.d})),true)}
function bxAll(el){const pid=el.dataset.pid,p=S.pass.find(x=>x.id===pid);baixa(openItemsAll(pid),true,'Zerar tudo o que está em aberto de '+p.nome+' ('+money(openTotal(pid))+')? Todos os trechos pendentes serão registrados como pagos.')}
function bxEveryone(){let items=[],tot=0,n=0;for(const p of S.pass){const o=openItemsAll(p.id);if(o.length){items=items.concat(o);tot+=openTotal(p.id);n++}}baixa(items,true,'Zerar as cobranças em aberto de '+n+' passageiro(s), no total de '+money(+tot.toFixed(2))+'? Todos os trechos pendentes serão registrados como pagos.')}

const bd=o=>Object.entries(o).map(([k,v])=>' data-'+k+'="'+v+'"').join('');
function bxPanel(p,i,r,pend){
  let h='<div class="bx">';
  for(const x of r.rows){
    h+='<div class="bxrow"><div class="grow"><b>'+dow(x.d)+' '+dm(x.d)+'</b></div><div class="legs">';

      h+='<button class="leg '+(paid?'on':'')+'" aria-pressed="'+paid+'"'+bd({pid:p.id,d:x.d,leg,paid:paid?1:0})+' onclick="bxLeg(this)"><span class="row1">'+(paid?ic('check'):'')+(leg==='ida'?'Ida':'Volta')+'</span><small>'+(paid?'paga':money(x.fare))+'</small></button>';
    }
    h+='</div></div>';
  }
  if(!r.rows.length)h+='<div class="mut sm" style="padding:8px 0">Sem viagens neste período.</div>';
  h+='<div class="actions" style="padding:12px 0 0">'
   +'<button class="btn ok sm"'+bd({pid:p.id,i})+' onclick="bxPeriod(this)"'+(r.open>0?'':' disabled')+'>'+ic('check')+'Baixar este período ('+money(r.open)+')</button></div>';

  }
  const tot=openTotal(p.id);
  h+='<div class="actions" style="padding:12px 0 0"><button class="btn sec sm"'+bd({pid:p.id})+' onclick="bxAll(this)"'+(tot>0?'':' disabled')+'>Zerar tudo em aberto ('+money(tot)+')</button></div></div>';
  return h;
}

  h+='</table></div><div class="field-note">I = ida, V = volta, I+V = ida e volta. Marcas em verde forte já foram pagas. Os dias são editados na aba Embarques.</div><h3>Cobranças</h3>';
  let any=false;h+='<div class="surface">';
  for(const p of S.pass){
    const r=personPeriod(p.id,i),pend=pending(p.id,i);if(!r.n&&!pend.tot)continue;any=true;

    h+='<div style="border-top:1px solid var(--line)"><div class="item" style="border:0"><div class="avatar">'+esc(initials(p.nome))+'</div><div class="grow"><div class="nm">'+esc(p.nome)+'</div><div>'+tagOf(st,r)+'</div>'
     +'<div class="sm mut">Pago '+money(r.paid)+' de '+money(r.total)+' no período</div>'

     +'<div class="actions"><button class="btn sm" onclick="sendWA(\''+p.id+'\','+i+')">'+ic('chat')+'WhatsApp</button>'
     +'<button class="btn sec sm" onclick="copy(buildMsg(S.pass.find(x=>x.id===\''+p.id+'\'),'+i+'))">'+ic('copy')+'Copiar texto</button>'
     +'<button class="btn sec sm" onclick="document.getElementById(\'m_'+p.id+'\').classList.toggle(\'hide\')">'+ic('eye')+'Ver</button>'
     +'<button class="btn '+(openB[p.id]?'sec':'ok')+' sm"'+bd({pid:p.id})+' onclick="togB(this)" aria-expanded="'+!!openB[p.id]+'">'+ic('check')+'Dar baixa</button></div>'
     +'<pre class="hide" id="m_'+p.id+'">'+esc(buildMsg(p,i))+'</pre>'
     +(openB[p.id]?bxPanel(p,i,r,pend):'')+'</div>';

    for(const b of S.baixas.slice(0,10)){const p=S.pass.find(x=>x.id===b.pid);
      h+='<div class="item"><div class="grow"><div class="nm">'+esc(p?p.nome:'Passageiro removido')+'</div><div class="mut sm">'+(b.tipo==='baixa'?'Baixa':'Baixa desfeita')+' de '+b.trechos+' trecho(s), viagens de '+dm(b.de)+(b.de!==b.ate?' a '+dm(b.ate):'')+', em '+dm(b.at.slice(0,10))+' às '+b.at.slice(11)+'</div></div><div class="amount" style="color:'+(b.tipo==='baixa'?'var(--ok)':'var(--bad)')+'">'+(b.tipo==='baixa'?'+':'-')+money(b.valor)+'</div></div>'}
    h+='</div>';
  }
  return h;
}
function exportCSV(i){
  const days=pDays(i),rows=[['Passageiro','Telefone',...days.map(d=>dow(d)+' '+dm(d)),'Trechos','Total (R$)','Pago (R$)','Em aberto (R$)','Status']];
  const f=v=>v.toFixed(2).replace('.',',');
  for(const p of S.pass){const r=personPeriod(p.id,i);if(!r.n)continue;const st=S.pay[pKey(i,p.id)]||{};
    rows.push([p.nome,p.tel||'',...days.map(d=>{const l=legs(d,p.id);return l.ida&&l.volta?'ida+volta':l.ida?'ida':l.volta?'volta':''}),r.n,f(r.total),f(r.paid),f(r.open),statusTxt(st,r)])}
  dl('\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'cobranca_'+pStart(i)+'.csv','text/csv');
}

   +'<div class="grid2"><div><label for="du">Usuário</label><input id="du" autocapitalize="none" autocomplete="off"></div><div><label for="dp">Senha inicial</label><input id="dp" type="password" autocomplete="new-password"></div></div>'
   +'<div class="field-note">Passe o usuário e a senha ao novo motorista. Ele pode trocar a senha em Minha conta.</div>'
   +'<div class="actions" style="padding:14px 0 0"><button class="btn" onclick="addDriver()">Adicionar motorista</button></div></div></div>';
  return h;
}
async function addDriver(){try{await api('POST','/api/driver',{nome:dn.value,user:du.value,pin:dp.value});await load();toast('Motorista adicionado')}catch(e){toast(e.message)}}
async function delDriver(id){if(!confirm('Remover este motorista? Ele perde o acesso imediatamente.'))return;try{await api('POST','/api/driver/delete',{id});await load();toast('Motorista removido')}catch(e){toast(e.message)}}
async function resetDriver(id){try{await api('POST','/api/driver/reset',{id,pin:rp.value});resetId=null;await load();toast('Senha alterada')}catch(e){toast(e.message)}}
function vConta(){
  const drv=S.role==='driver';
  return '<div class="surface pad"><h2>Minha conta</h2><div class="mut">'+esc(S.me.nome)+(drv?', usuário '+esc(S.me.user):'')+'</div>'
   +'<label for="pa">'+(drv?'Senha atual':'PIN atual')+'</label><input id="pa" type="password" autocomplete="current-password" '+(drv?'':'inputmode="numeric"')+'>'
   +'<label for="pn1">'+(drv?'Nova senha <small>(mínimo de 6 caracteres)</small>':'Novo PIN <small>(mínimo de 4 dígitos)</small>')+'</label><input id="pn1" type="password" autocomplete="new-password" '+(drv?'':'inputmode="numeric"')+'>'
   +'<label for="pn2">Repita a nova '+(drv?'senha':'PIN')+'</label><input id="pn2" type="password" autocomplete="new-password" '+(drv?'':'inputmode="numeric"')+'>'
   +'<div class="actions" style="padding:16px 0 0"><button class="btn" onclick="changePw()">Alterar '+(drv?'senha':'PIN')+'</button></div><div class="field-note">Ao alterar, os outros aparelhos conectados com esta conta são desconectados.</div></div>';
}
async function changePw(){
  if(pn1.value!==pn2.value)return toast('As senhas novas não são iguais');
  try{await api('POST','/api/password',{atual:pa.value,nova:pn1.value});pa.value=pn1.value=pn2.value='';toast('Senha alterada')}catch(e){toast(e.message)}
}
async function saveCfg(){
  try{await api('POST','/api/cfg',{fare:cf.value.replace(',','.'),origem:co.value,destino:cd.value,ciclo:cc.value,anchor:ca.value,pix:cp.value,msgFim:cm.value});periodIdx=null;await load();toast('Configurações salvas')}catch(e){toast(e.message)}
}

// ---------- Passageiro ----------
function ticket(leg,l,o,d){
  const on=l[leg],name=leg==='ida'?'Ida':'Volta',from=leg==='ida'?o:d,to=leg==='ida'?d:o;
  return '<button class="ticket '+(on?'on':'')+'" aria-pressed="'+on+'" onclick="boarding(\''+leg+'\','+!on+')">'
   +'<div class="main"><div><div class="big">'+name+'</div><div class="rt">'+esc(from)+' para '+esc(to)+'</div></div><div class="badge">'+ic('check')+'</div></div>'
   +'<div class="stub">'+(on?'Embarque confirmado'+(l[leg+'At']?' às '+l[leg+'At']:''):'Toque para confirmar o embarque')+'</div></button>';
}
function vHoje(){
  const d=S.today,wk=parse(d).getDay(),me=S.me,l=legs(d,me.id),c=(l.ida?1:0)+(l.volta?1:0);
  let h='<div style="padding:4px 2px"><h2>Olá, '+esc(me.nome.split(' ')[0])+'</h2><div class="mut">Hoje é '+dowl(d)+', '+dm(d)+'.</div></div>';
  if(wk===0||wk===6)return h+'<div class="surface pad"><b>Sem viagem hoje</b><div class="mut">O carro roda de segunda a sexta.</div></div>';
  h+=ticket('ida',l,S.cfg.origem,S.cfg.destino)+ticket('volta',l,S.cfg.origem,S.cfg.destino);
  h+='<div class="surface"><div class="kv"><span>Passagem por trecho</span><b>'+money(l.fare||fareOf(me))+'</b></div><div class="kv"><span>Confirmado hoje</span><b>'+c+' de 2 trechos, '+money(c*(l.fare||fareOf(me)))+'</b></div></div>'
   +'<div class="field-note">Toque de novo em uma passagem confirmada para desfazer.</div>';
  return h;
}
const boarding=(leg,val)=>act('POST','/api/boarding',{leg,val});
function vMinha(){
  if(periodIdx===null)periodIdx=idxOf(S.today);
  const i=periodIdx,me=S.me,r=personPeriod(me.id,i),pend=pending(me.id,i),st=S.pay[pKey(i,me.id)]||{};
  let h='<div class="surface pad"><div class="stepper"><button class="btn sec" aria-label="Período anterior" onclick="periodIdx--;render()">'+ic('l')+'</button><div class="mid"><b>'+pLabel(i)+'</b><div class="mut">'+r.n+' trecho(s) no período</div></div><button class="btn sec" aria-label="Próximo período" onclick="periodIdx++;render()">'+ic('r')+'</button></div></div>'
   +'<div class="surface pad summary"><div><div style="margin-bottom:6px">'+tagOf(st,r)+'</div><div class="mut">Em aberto no período</div><div class="total">'+money(r.open)+'</div></div><div class="mut" style="text-align:right">Total: '+money(r.total)+'<br>Pago: '+money(r.paid)+'</div></div>';
  if(pend.tot>0||S.cfg.pix)h+='<div class="surface">'+(pend.tot>0?'<div class="kv"><span>Em aberto de períodos anteriores</span><b style="color:var(--bad)">'+money(pend.tot)+'</b></div>':'')+(S.cfg.pix?'<div class="kv"><span>Chave Pix</span><b>'+esc(S.cfg.pix)+'</b></div>':'')+'</div>';
  h+='<h3>Viagens do período</h3><div class="surface scroll"><table><tr><th>Dia</th><th>Ida</th><th>Volta</th><th>Valor</th><th>Situação</th></tr>';
  const cell=(on,paid)=>on?'<span class="mark'+(paid?' paid':'')+'">'+ic('check')+'</span>':'<span class="mark none">-</span>';
  for(const x of r.rows)h+='<tr><td>'+dow(x.d)+' '+dm(x.d)+'</td><td>'+cell(x.ida,x.idaPago)+'</td><td>'+cell(x.volta,x.voltaPago)+'</td><td class="v">'+money(x.v)+'</td><td>'+(x.open<=0?'<span class="tag t-paid">Pago</span>':(x.v>x.open?'<span class="tag t-sent">Parcial</span>':'<span class="tag t-pend">Em aberto</span>'))+'</td></tr>';
  if(!r.rows.length)h+='<tr><td colspan="5" class="mut" style="text-align:left">Nenhuma viagem neste período.</td></tr>';
  h+='</table></div><div class="field-note">Marcas em verde forte indicam trechos já pagos.</div>';
  if(S.baixas&&S.baixas.length){h+='<h3>Pagamentos registrados</h3><div class="surface">';
    for(const b of S.baixas.slice(0,8))h+='<div class="kv"><span>'+(b.tipo==='baixa'?'Baixa':'Baixa desfeita')+' em '+dm(b.at.slice(0,10))+', '+b.trechos+' trecho(s)</span><b>'+(b.tipo==='baixa'?'':'-')+money(b.valor)+'</b></div>';
    h+='</div>'}
  return h;
}

// ---------- Render ----------
function render(){
  if(!S)return;
  if(!selDate)selDate=S.today;
  const drv=S.role==='driver';
  const tabs=drv?[['lanc','Embarques','circle'],['cob','Cobrança','receipt'],['pass','Passageiros','users'],['cfg','Config','sliders']]:[['hoje','Hoje','circle'],['minha','Minha cobrança','receipt'],['conta','Minha conta','users']];
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  chrome(true);
  document.getElementById('navin').innerHTML=tabs.map(([k,t,i])=>'<button data-t="'+k+'" class="'+(k===tab?'on':'')+'"'+(k===tab?' aria-current="page"':'')+'>'+ic(i)+t+'</button>').join('');
  document.querySelectorAll('#navin button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
  setRoute(S.cfg.origem,S.cfg.destino);
  document.getElementById('who').textContent=S.me.nome;
  document.getElementById('app').innerHTML={lanc:vLanc,cob:vCob,pass:vPass,cfg:vCfg,hoje:vHoje,minha:vMinha,conta:vConta}[tab]();
  const dt=document.getElementById('dt');if(dt)dt.onchange=()=>{if(dt.value){selDate=dt.value;render()}};
}
boot();
</script>
</body>
</html>
